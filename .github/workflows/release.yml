name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build the Windows installer and
# publish it to this repo's Releases, where installed copies of Anvil find it (ADR-010).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm run typecheck
          npm test

      # electron-builder uploads its files in parallel, and each upload creates the release if
      # it's missing. Two of them racing made two releases for v0.1.0 and lost files, so the
      # release is created first.
      - name: Create the release
        shell: bash
        run: |
          # The notes are this version's section of CHANGELOG.md, up to the next "## " heading.
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "See the README for what's new." > notes.md
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Anvil ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: |
          npm run build
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
