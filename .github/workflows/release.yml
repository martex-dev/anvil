name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build the Windows installer and
# publish it to this repo's Releases, where installed copies of Anvil find it (ADR-010).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm run typecheck
          npm test

      - name: Build and publish
        run: |
          npm run build
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
